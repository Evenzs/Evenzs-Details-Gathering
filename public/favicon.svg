<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="32" height="32">
  <defs>
    <linearGradient id="fvbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121B2B"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="fvglass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B6914" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#D4AF37"/>
      <stop offset="60%" stop-color="#F0D870" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#8B6914" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="fvliq" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F0D870" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0.88"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="0" y="0" width="140" height="140" rx="28" fill="url(#fvbg)"/>

  <!-- Arc: from bottom-left to upper-right, wrapping below glasses -->
  <path d="M 20 102 A 58 58 0 1 1 115 24" fill="none" stroke="#D4AF37" stroke-width="4.5" stroke-linecap="round" opacity="0.9"/>

  <!-- Star at arc tip -->
  <circle cx="115" cy="24" r="5" fill="#D4AF37" opacity="0.9"/>
  <circle cx="115" cy="24" r="2" fill="#F0D870"/>

  <!-- Left flute, leaning right (+7°), scaled 0.72 -->
  <g transform="translate(14,34) rotate(7,15.84,67.725) scale(0.72)">
    <!-- Bowl -->
    <path d="M 0 2 C 1.5 22.4 18.5 49.92 19.5 64 L 24.5 64 C 25.5 49.92 42.5 22.4 44 2 Z" fill="url(#fvglass)"/>
    <!-- Liquid -->
    <path d="M 4.5 16.6 C 3.6 35 4.4 51.2 4.1 62.7 L 8.4 62.7 C 8.1 51.2 8.9 35 10.3 16.6 Z" fill="url(#fvliq)" opacity="0.82"/>
    <!-- Meniscus -->
    <ellipse cx="6.3" cy="16.6" rx="1.8" ry="0.9" fill="#F0D870" opacity="0.5"/>
    <!-- Rim -->
    <path d="M 0 2 C 0 6.5 44 6.5 44 2 C 44 -2.5 0 -2.5 0 2 Z" fill="#D4AF37" opacity="0.7"/>
    <!-- Stem -->
    <rect x="19.5" y="64" width="5" height="26" fill="#D4AF37" opacity="0.75" rx="1"/>
    <!-- Base foot -->
    <path d="M 2 90 C 2 92.7 10 94.5 22 94.5 C 34 94.5 42 92.7 42 90 Z" fill="#D4AF37" opacity="0.7"/>
    <!-- Highlight -->
    <line x1="5" y1="8" x2="8" y2="44" stroke="#F0D870" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Right flute, leaning left (-7°), scaled 0.72 -->
  <g transform="translate(65,34) rotate(-7,15.84,67.725) scale(0.72)">
    <path d="M 0 2 C 1.5 22.4 18.5 49.92 19.5 64 L 24.5 64 C 25.5 49.92 42.5 22.4 44 2 Z" fill="url(#fvglass)"/>
    <path d="M 4.5 16.6 C 3.6 35 4.4 51.2 4.1 62.7 L 8.4 62.7 C 8.1 51.2 8.9 35 10.3 16.6 Z" fill="url(#fvliq)" opacity="0.82"/>
    <ellipse cx="6.3" cy="16.6" rx="1.8" ry="0.9" fill="#F0D870" opacity="0.5"/>
    <path d="M 0 2 C 0 6.5 44 6.5 44 2 C 44 -2.5 0 -2.5 0 2 Z" fill="#D4AF37" opacity="0.7"/>
    <rect x="19.5" y="64" width="5" height="26" fill="#D4AF37" opacity="0.75" rx="1"/>
    <path d="M 2 90 C 2 92.7 10 94.5 22 94.5 C 34 94.5 42 92.7 42 90 Z" fill="#D4AF37" opacity="0.7"/>
    <line x1="5" y1="8" x2="8" y2="44" stroke="#F0D870" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Bubble trail between glasses -->
  <g transform="translate(68,72)" opacity="0.85">
    <circle cx="0" cy="0" r="3.2" fill="none" stroke="#D4AF37" stroke-width="0.8"/>
    <circle cx="-6" cy="-9" r="2.4" fill="none" stroke="#D4AF37" stroke-width="0.7"/>
    <circle cx="7" cy="-7" r="2.0" fill="none" stroke="#D4AF37" stroke-width="0.6"/>
    <circle cx="-12" cy="-18" r="1.7" fill="none" stroke="#D4AF37" stroke-width="0.5"/>
    <circle cx="4" cy="-20" r="1.4" fill="none" stroke="#D4AF37" stroke-width="0.5"/>
    <circle cx="-8" cy="-30" r="1.0" fill="none" stroke="#D4AF37" stroke-width="0.4"/>
  </g>
</svg>
